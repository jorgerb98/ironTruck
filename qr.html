<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronTrack - QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07040d;
      color: #e9d5ff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: linear-gradient(135deg, #110a1f, #1a0f2e);
      border: 1px solid #2a1645;
      border-radius: 24px;
      padding: 40px 36px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 0 60px rgba(147,51,234,0.25);
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #a78bfa;
      margin-bottom: 28px;
    }
    .qr-wrapper {
      background: white;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      box-shadow: 0 0 30px rgba(236,72,153,0.3);
    }
    .qr-wrapper img {
      display: block;
      width: 220px;
      height: 220px;
      border-radius: 8px;
    }
    .url-label {
      margin-top: 20px;
      font-size: 11px;
      color: #7c3aed;
      word-break: break-all;
      background: #0d071a;
      border: 1px solid #2a1645;
      border-radius: 10px;
      padding: 8px 12px;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #9333ea;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏋️ IronTrack</div>
    <div class="subtitle">Escanea con tu móvil para abrir la app</div>
    <div class="qr-wrapper">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Flunch-abraham-apparent-demanding.trycloudflare.com&color=7c3aed&bgcolor=ffffff&qzone=1" alt="QR IronTrack">
    </div>
    <div class="url-label">https://lunch-abraham-apparent-demanding.trycloudflare.com</div>
    <div class="hint">📱 Abre la cámara y apunta al QR</div>
  </div>
</body>
</html>
